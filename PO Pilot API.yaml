components:
  schemas:
    AssessmentDetail:
      type: object
      description: Response detail for assessment.
      properties:
        id:
          type: integer
          readOnly: true
        course_instance:
          allOf:
          - $ref: '#/components/schemas/CourseInstanceList'
          readOnly: true
        name:
          type: string
          description: 'Ex: Midterm 1, Final Exam, Project 1'
          maxLength: 50
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        max_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          title: Contribution weight to final grade (%)
          description: 'Weight of this assessment towards the final course grade ex:
            20 for 20%'
        lo_contributions:
          type: string
          readOnly: true
      required:
      - assessment_type
      - course_instance
      - id
      - lo_contributions
      - name
      - weight
    AssessmentGrade:
      type: object
      description: Standard assessment grade serializer.
      properties:
        id:
          type: integer
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        student_id:
          type: integer
          writeOnly: true
        assessment:
          allOf:
          - $ref: '#/components/schemas/AssessmentList'
          readOnly: true
        assessment_id:
          type: integer
          writeOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        entered_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assessment
      - assessment_id
      - created_at
      - entered_by
      - id
      - score
      - student
      - student_id
      - updated_at
    AssessmentGradeDetail:
      type: object
      description: Detailed assessment grade serializer with LO/PO contribution calculations.
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        student_name:
          type: string
          readOnly: true
        assessment:
          allOf:
          - $ref: '#/components/schemas/AssessmentList'
          readOnly: true
        assessment_id:
          type: integer
          writeOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        percentage:
          type: string
          readOnly: true
        weighted_score:
          type: string
          readOnly: true
        entered_by:
          type: integer
          readOnly: true
          nullable: true
        entered_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assessment
      - assessment_id
      - created_at
      - entered_by
      - entered_by_name
      - id
      - percentage
      - score
      - student
      - student_name
      - updated_at
      - weighted_score
    AssessmentList:
      type: object
      description: Response summary for assessments.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
