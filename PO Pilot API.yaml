      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
        '400':
          description: Bad Request
  /api/course-instances/:
    get:
      operationId: course_instances_list
      parameters:
      - in: query
        name: instructor
        schema:
          type: string
        description: Filter by instructor ID or "me"/"current_user"
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filter by active status (true/false)
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: semester
        schema:
          type: string
        description: Filter by semester (e.g., "Fall", "Spring")
      - in: query
        name: year
        schema:
          type: integer
        description: Filter by year (e.g., 2024)
      tags:
      - course-instances
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseInstanceListList'
          description: ''
    post:
