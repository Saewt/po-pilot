            schema:
              $ref: '#/components/schemas/AssessmentToLOContributionWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssessmentToLOContributionWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssessmentToLOContributionWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentToLOContributionWrite'
          description: ''
