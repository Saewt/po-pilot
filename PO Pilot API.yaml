openapi: 3.0.3
info:
  title: PO Pilot API
  version: 1.0.2
  description: API documentation for the PO Pilot project.
paths:
  /api/achievements/course/{course_instance_id}/lo/:
    get:
      operationId: achievements_course_lo_list
      description: Returns statistics for all Learning Outcomes in a course instance
        (avg/min/max).
      summary: Get course LO statistics
      parameters:
      - in: path
        name: course_instance_id
        schema:
          type: string
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - achievements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseLOAchievementList'
          description: ''
  /api/achievements/student/{student_id}/:
    get:
      operationId: achievements_student_retrieve
      description: Returns comprehensive report of PO achievements across all courses
        for a student.
      summary: Get student's overall PO achievements
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          description: Only for students
        required: true
      tags:
      - achievements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentOverallReport'
          description: ''
  /api/achievements/student/{student_id}/course/{course_instance_id}/:
    get:
      operationId: achievements_student_course_retrieve
      description: Returns PO achievements for a specific student in a specific course
        instance.
      summary: Get student's achievements for a specific course
      parameters:
      - in: path
        name: course_instance_id
        schema:
          type: string
        required: true
      - in: path
        name: student_id
        schema:
          type: string
          description: Only for students
        required: true
      tags:
      - achievements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAchievement'
          description: ''
  /api/announcements/:
    get:
      operationId: announcements_list
      description: ViewSet for course-level announcements by instructors.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - announcements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseAnnouncementList'
          description: ''
    post:
      operationId: announcements_create
      description: ViewSet for course-level announcements by instructors.
      tags:
      - announcements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseAnnouncement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseAnnouncement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseAnnouncement'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAnnouncement'
          description: ''
  /api/announcements/{id}/:
    get:
      operationId: announcements_retrieve
      description: ViewSet for course-level announcements by instructors.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - announcements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAnnouncement'
          description: ''
    put:
      operationId: announcements_update
      description: ViewSet for course-level announcements by instructors.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - announcements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseAnnouncement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseAnnouncement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseAnnouncement'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAnnouncement'
          description: ''
    patch:
      operationId: announcements_partial_update
      description: ViewSet for course-level announcements by instructors.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - announcements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourseAnnouncement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourseAnnouncement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourseAnnouncement'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAnnouncement'
          description: ''
    delete:
      operationId: announcements_destroy
      description: ViewSet for course-level announcements by instructors.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - announcements
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/announcements/{id}/mark-as-read/:
    patch:
      operationId: announcements_mark_as_read_partial_update
      description: Mark a single course announcement as read.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - announcements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourseAnnouncement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourseAnnouncement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourseAnnouncement'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAnnouncement'
          description: ''
  /api/announcements/mark-all-read/:
    patch:
      operationId: announcements_mark_all_read_partial_update
      description: Mark all course announcements as read for the current user.
      tags:
      - announcements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourseAnnouncement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourseAnnouncement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourseAnnouncement'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAnnouncement'
          description: ''
  /api/announcements/unread-count/:
    get:
      operationId: announcements_unread_count_retrieve
      description: Get count of unread course announcements.
      tags:
      - announcements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAnnouncement'
          description: ''
  /api/assessment-lo-contributions/:
    get:
