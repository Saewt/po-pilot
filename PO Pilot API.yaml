  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Change the current user's password. Clears must_change_password
        flag on success.
      summary: Change Password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Bad Request - Invalid old password or validation error
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Takes a set of user credentials and returns an access and refresh
        JSON web token pair to prove the authentication of those credentials.
      summary: Login (Obtain JWT Pair)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
        '401':
          description: Unauthorized
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the refresh token.
      summary: Logout (Blacklist Token)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          description: Successfully logged out
        '400':
          description: Bad Request
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Takes a refresh type JSON web token and returns an access type
        JSON web token if the refresh token is valid.
      summary: Refresh Access Token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenRefresh'
          description: ''
        '401':
          description: Unauthorized
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Register a new student user. Requires a valid .edu email and student
