          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        student_id:
          type: integer
          writeOnly: true
        assessment:
          allOf:
          - $ref: '#/components/schemas/AssessmentList'
          readOnly: true
        assessment_id:
          type: integer
          writeOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        entered_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedAssessmentToLOContributionWrite:
      type: object
      properties:
        assessment_id:
          type: integer
          writeOnly: true
        learning_outcome_id:
          type: integer
          writeOnly: true
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,1})?$
    PatchedAssessmentWrite:
      type: object
      description: Request schema for creating/updating assessments.
      properties:
        id:
          type: integer
          readOnly: true
        course_instance_id:
          type: integer
          writeOnly: true
        name:
          type: string
          description: 'Ex: Midterm 1, Final Exam, Project 1'
          maxLength: 50
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        max_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          title: Contribution weight to final grade (%)
          description: 'Weight of this assessment towards the final course grade ex:
            20 for 20%'
    PatchedCourseInstanceWrite:
      type: object
      description: Request schema for creating/updating course instances.
      properties:
        id:
          type: integer
          readOnly: true
        course_template_id:
          type: integer
          writeOnly: true
        semester:
          type: string
          description: 'Ex: Fall 2024'
          maxLength: 20
        year:
          type: integer
          description: 'Ex: 2024'
        instructor_id:
          type: integer
          writeOnly: true
          nullable: true
        is_active:
          type: boolean
        students:
          type: array
          items:
            type: integer
