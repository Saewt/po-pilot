components:
  schemas:
    ActionEnum:
      enum:
      - approve
      - decline
      - reset_to_pending
      type: string
      description: |-
        * `approve` - approve
        * `decline` - decline
        * `reset_to_pending` - reset_to_pending
    ApprovalStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - DECLINED
      type: string
      description: |-
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `DECLINED` - Declined
    AssessmentDetail:
      type: object
      description: Response detail for assessment.
      properties:
        id:
          type: integer
          readOnly: true
        course_instance:
          allOf:
          - $ref: '#/components/schemas/CourseInstanceList'
          readOnly: true
        name:
          type: string
          description: 'Ex: Midterm 1, Final Exam, Project 1'
          maxLength: 50
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        max_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          title: Contribution weight to final grade (%)
          description: 'Weight of this assessment towards the final course grade ex:
            20 for 20%'
        lo_contributions:
          type: string
          readOnly: true
      required:
      - assessment_type
      - course_instance
      - id
      - lo_contributions
      - name
      - weight
    AssessmentGrade:
      type: object
      description: Standard assessment grade serializer.
      properties:
        id:
          type: integer
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        student_id:
          type: integer
          writeOnly: true
        assessment:
          allOf:
          - $ref: '#/components/schemas/AssessmentList'
          readOnly: true
        assessment_id:
          type: integer
          writeOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Score obtained (0-max_score of assessment)
        entered_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assessment
      - assessment_id
      - created_at
      - entered_by
      - id
      - score
      - student
      - student_id
      - updated_at
    AssessmentGradeDetail:
      type: object
      description: Detailed assessment grade serializer with LO/PO contribution calculations.
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        student_name:
          type: string
          readOnly: true
        assessment:
          allOf:
          - $ref: '#/components/schemas/AssessmentList'
          readOnly: true
        assessment_id:
          type: integer
          writeOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Score obtained (0-max_score of assessment)
        percentage:
          type: string
          readOnly: true
        weighted_score:
          type: string
          readOnly: true
        entered_by:
          type: integer
          readOnly: true
          nullable: true
        entered_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assessment
      - assessment_id
      - created_at
      - entered_by
      - entered_by_name
      - id
      - percentage
      - score
      - student
      - student_name
      - updated_at
      - weighted_score
    AssessmentList:
      type: object
      description: Response summary for assessments.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: 'Ex: Midterm 1, Final Exam, Project 1'
          maxLength: 50
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        max_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          title: Contribution weight to final grade (%)
          description: 'Weight of this assessment towards the final course grade ex:
            20 for 20%'
      required:
      - assessment_type
      - id
      - name
      - weight
    AssessmentToLOContributionList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        learning_outcome:
          allOf:
          - $ref: '#/components/schemas/LearningOutcomeList'
          readOnly: true
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,1})?$
      required:
      - id
      - learning_outcome
      - weight
    AssessmentToLOContributionWrite:
      type: object
      properties:
        assessment_id:
          type: integer
          writeOnly: true
        learning_outcome_id:
          type: integer
          writeOnly: true
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,1})?$
      required:
      - assessment_id
      - learning_outcome_id
      - weight
    AssessmentTypeEnum:
      enum:
      - MIDTERM
      - FINAL
      - PROJECT
      - HOMEWORK
      - QUIZ
      - LAB
      type: string
      description: |-
        * `MIDTERM` - Midterm Exam
        * `FINAL` - Final Exam
        * `PROJECT` - Project
        * `HOMEWORK` - Homework
        * `QUIZ` - Quiz
        * `LAB` - Lab
    AssessmentWrite:
      type: object
      description: Request schema for creating/updating assessments.
      properties:
        id:
          type: integer
          readOnly: true
        course_instance_id:
          type: integer
          writeOnly: true
        name:
          type: string
          description: 'Ex: Midterm 1, Final Exam, Project 1'
          maxLength: 50
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        max_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          title: Contribution weight to final grade (%)
          description: 'Weight of this assessment towards the final course grade ex:
            20 for 20%'
      required:
      - assessment_type
      - course_instance_id
      - id
      - name
      - weight
    AudienceEnum:
      enum:
      - STUDENTS
      - INSTRUCTORS
      - ALL
      type: string
      description: |-
        * `STUDENTS` - Students
        * `INSTRUCTORS` - Instructors
        * `ALL` - All
    BulkGradeCreate:
      type: object
      description: |-
        Bulk grade creation with ownership validation.
        All grades are created atomically - if one fails, all fail.
      properties:
        grades:
          type: array
          items:
            $ref: '#/components/schemas/BulkGradeItem'
          description: List of grades to create
      required:
      - grades
    BulkGradeImport:
      type: object
      description: Serializer for bulk grade import via file.
      properties:
        assessment_id:
          type: integer
          description: ID of the assessment to grade
        file:
          type: string
          format: uri
          description: CSV or Excel file with 'student_id' and 'score' columns
      required:
      - assessment_id
      - file
    BulkGradeItem:
      type: object
      description: Single grade item for bulk operations.
      properties:
        assessment_id:
          type: integer
          description: ID of the assessment to grade
        student_id:
          type: integer
          description: ID of the student receiving the grade
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Score value (0-100)
      required:
      - assessment_id
      - score
      - student_id
    BulkGradeUpdate:
      type: object
      description: |-
        Bulk grade update with upsert behavior.
        Updates existing grades or creates new ones atomically.
      properties:
        grades:
          type: array
          items:
            $ref: '#/components/schemas/BulkGradeItem'
          description: List of grades to update/create
      required:
      - grades
    BulkStudentCreate:
      type: object
      description: Bulk student creation request.
      properties:
        department:
          type: string
          description: Department code or name (must match your department)
          maxLength: 100
        students:
          type: array
          items:
            $ref: '#/components/schemas/BulkStudentItem'
          description: List of students to create
      required:
      - department
      - students
    BulkStudentDelete:
      type: object
      description: Bulk student deletion request.
      properties:
        student_ids:
          type: array
          items:
            type: string
          description: List of Student IDs to delete
      required:
      - student_ids
    BulkStudentItem:
      type: object
      description: Single student data for bulk creation.
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        student_id:
          type: string
          maxLength: 9
        enrollment_year:
          type: integer
          nullable: true
      required:
      - email
      - first_name
      - last_name
      - student_id
    BulkStudentResult:
      type: object
      description: Response for bulk student creation.
      properties:
        created_count:
          type: integer
