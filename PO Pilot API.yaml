openapi: 3.0.3
info:
  title: PO Pilot API
  version: 1.0.2
  description: API documentation for the PO Pilot project.
paths:
  /api/assessment-lo-contributions/:
    get:
      operationId: assessment_lo_contributions_list
      description: |-
        ViewSet for managing Assessment to LO contributions.
        Allows instructors to connect exam/quiz questions to Learning Outcomes.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - assessment-lo-contributions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssessmentToLOContributionListList'
          description: ''
    post:
      operationId: assessment_lo_contributions_create
      description: |-
        ViewSet for managing Assessment to LO contributions.
        Allows instructors to connect exam/quiz questions to Learning Outcomes.
      tags:
      - assessment-lo-contributions
